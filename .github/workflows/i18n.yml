name: Translations up to date

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install markdown
        run: python -m pip install markdown

      - name: Check generated translations
        run: python i18n/build.py --check
