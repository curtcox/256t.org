<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>t256 browser loader demo</title>
<style>:root{color-scheme:light dark;font:17px/1.6 system-ui}body{max-width:800px;margin:40px auto;padding:20px}input,button{font:inherit;padding:10px;border:1px solid #888;border-radius:6px}input{width:95%;margin-bottom:12px}#preview{width:120px;height:120px;border:1px solid #888;border-radius:8px}output{display:block;margin:20px 0;white-space:pre-wrap}a{color:inherit}</style></head>
<body><h1>Verified content in your browser</h1><p>This page loads an image and two scripts through the t256 page loader. The helper verifies provider content; the loader verifies original bytes again before using them.</p>
<label>Connection URL from your helper<input id="base" placeholder="http://127.0.0.1:25600/s/…"></label><button id="run">Run inline-content demo</button>
<output id="result" role="status">Connect your helper to begin.</output><img id="preview" alt="An inline SVG loaded from its t256 URI"><p id="script-result"></p>
<p><a href="./">Provider settings</a> · <a href="https://github.com/curtcox/256t.org/tree/main/browser-support">Integration guide</a></p><script type="module" src="./demo.mjs"></script></body></html>
