  <header>
    <h1>256t 文件 CID 检查</h1>
    <p>上传或拖入一个文件，分析其内容并计算其内容标识符（CID）。</p>
    <nav>
      <a href="index.html">← 首页</a>
      <a href="hash.html">哈希计算器</a>
      <a href="examples.html">CID 示例</a>

    </nav>
  </header>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" aria-label="选择文件">
    <span class="drop-zone-label">将文件拖放到此处，或点击浏览</span>
    <span class="drop-zone-hint">支持任意文件类型</span>
  </div>

  <div id="fileInfo" class="file-info hidden">
    <div><strong>文件名：</strong> <span id="fileName"></span></div>
    <div><strong>文件类型：</strong> <span id="fileType"></span></div>
    <div><strong>文件大小：</strong> <span id="fileSize"></span></div>
  </div>

  <div id="previewSection" class="preview-section hidden">
    <h2>内容预览</h2>
    <div class="preview-content" id="previewContent"></div>
  </div>

  <section id="output" class="output hidden" aria-live="polite" aria-atomic="true">
    <dl>
      <div>
        <dt>内容长度</dt>
        <dd id="byteLength">0 字节</dd>
      </div>
      <div>
        <dt>Base64 长度</dt>
        <dd id="base64Length">AAAAAAAA</dd>
      </div>
      <div>
        <dt>SHA-512 (Base64URL)</dt>
        <dd id="hashValue">—</dd>
      </div>
      <div>
        <dt>前 64 个字符（Base64URL）</dt>
        <dd id="prefixValue">—</dd>
      </div>
      <div>
        <dt>CID</dt>
        <dd id="fragmentValue">AAAAAAAA</dd>
      </div>
    </dl>
    <p id="error" class="error" hidden></p>
  </section>

  <script src="../implementations/ecmascript/cid.js"></script>
  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileType = document.getElementById('fileType');
    const fileSize = document.getElementById('fileSize');
    const previewSection = document.getElementById('previewSection');
    const previewContent = document.getElementById('previewContent');
    const output = document.getElementById('output');
    const hashValue = document.getElementById('hashValue');
    const byteLength = document.getElementById('byteLength');
    const base64LengthEl = document.getElementById('base64Length');
    const prefixValue = document.getElementById('prefixValue');
    const fragmentValue = document.getElementById('fragmentValue');
    const errorEl = document.getElementById('error');

    const formatByteLabel = (length) => `${length.toLocaleString()} 字节`;

    // Click on drop zone to trigger file input
    dropZone.addEventListener('click', () => {
      fileInput.click();
    });

    // Prevent default drag behaviors
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
      document.body.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    // Highlight drop zone when dragging over it
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => {
        dropZone.classList.add('drag-over');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => {
        dropZone.classList.remove('drag-over');
      }, false);
    });

    // Handle dropped files
    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    // Handle file input change
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function determineFileType(file) {
      if (file.type) {
        return file.type;
      }
      // Fallback to extension-based detection
      const ext = file.name.split('.').pop().toLowerCase();
      const typeMap = {
        'txt': 'text/plain',
        'html': 'text/html',
        'css': 'text/css',
        'js': 'text/javascript',
        'json': 'application/json',
        'xml': 'application/xml',
        'jpg': 'image/jpeg',
        'jpeg': 'image/jpeg',
        'png': 'image/png',
        'gif': 'image/gif',
        'svg': 'image/svg+xml',
        'webp': 'image/webp',
        'pdf': 'application/pdf',
        'zip': 'application/zip'
      };
      return typeMap[ext] || 'application/octet-stream';
    }

    function isTextFile(mimeType) {
      return mimeType.startsWith('text/') || 
             mimeType === 'application/json' ||
             mimeType === 'application/xml' ||
             mimeType === 'application/javascript';
    }

    function isImageFile(mimeType) {
      return mimeType.startsWith('image/');
    }

    async function handleFile(file) {
      try {
        errorEl.hidden = true;
        
        // Show file info
        const detectedType = determineFileType(file);
        fileName.textContent = file.name;
        fileType.textContent = detectedType || '未知';
        fileSize.textContent = formatByteLabel(file.size);
        fileInfo.classList.remove('hidden');

        // Read file as ArrayBuffer for CID calculation
        const arrayBuffer = await file.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);

        // Show preview if possible
        if (isTextFile(detectedType) && file.size <= 100000) {
          try {
            const text = new TextDecoder('utf-8', { fatal: true }).decode(data);
            const maxPreviewLength = 5000;
            const preview = text.length > maxPreviewLength 
              ? text.substring(0, maxPreviewLength) + '\n\n……（已截断，仅显示前 5000 个字符）'
              : text;
            previewContent.innerHTML = `<pre>${escapeHtml(preview)}</pre>`;
            previewSection.classList.remove('hidden');
          } catch (e) {
            // Not valid UTF-8, skip text preview
            previewSection.classList.add('hidden');
          }
        } else if (isImageFile(detectedType)) {
          const url = URL.createObjectURL(file);
          previewContent.innerHTML = `<img src="${url}" alt="${escapeHtml(file.name)} 的预览">`;
          previewSection.classList.remove('hidden');
        } else {
          previewSection.classList.add('hidden');
        }

        // Calculate CID and display results
        byteLength.textContent = formatByteLabel(data.length);

        const lengthBase64 = encodeLength(data.length);
        base64LengthEl.textContent = lengthBase64;

        const firstSixtyFour = data.slice(0, 64);
        const prefixBase64 = firstSixtyFour.length ? toBase64Url(firstSixtyFour) : '—';
        prefixValue.textContent = prefixBase64;

        const contentBase64 = data.length && data.length <= 64 ? toBase64Url(data) : '';

        const buffer = await crypto.subtle.digest('SHA-512', data);
        const hashBytes = new Uint8Array(buffer);
        const hashBase64 = toBase64Url(hashBytes);
        hashValue.textContent = hashBase64;

        const fragmentSuffix = data.length <= 64 ? contentBase64 : hashBase64;
        const cid = `${lengthBase64}${fragmentSuffix}`;
        fragmentValue.innerHTML = `<a href="../cids/${cid}">${cid}</a>`;

        output.classList.remove('hidden');
      } catch (error) {
        console.error('Error processing file:', error);
        hashValue.textContent = '—';
        prefixValue.textContent = '—';
        fragmentValue.textContent = '—';
        errorEl.textContent = `无法处理文件：${error.message}`;
        errorEl.hidden = false;
        output.classList.remove('hidden');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    if (!window.crypto || !window.crypto.subtle) {
      errorEl.textContent = '此浏览器不支持计算哈希所需的 Web Crypto API。';
      errorEl.hidden = false;
      output.classList.remove('hidden');
    }
  </script>
